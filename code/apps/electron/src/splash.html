<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0c0c0e;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 16px;
      user-select: none;
    }
    .icon {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      overflow: hidden;
    }
    .icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    h1 { font-size: 22px; font-weight: 600; }
    .subtitle { font-size: 12px; color: #a1a1aa; margin-top: -8px; }
    .status { font-size: 13px; color: #71717a; min-height: 18px; }
    .track {
      width: 180px;
      height: 3px;
      background: #ffffff14;
      border-radius: 99px;
      overflow: hidden;
      margin-top: 4px;
    }
    .fill {
      height: 100%;
      background: #f59e0b;
      border-radius: 99px;
      width: 30%;
      animation: progress 2s ease-in-out infinite alternate;
    }
    @keyframes progress {
      from { width: 20%; }
      to   { width: 80%; }
    }
  </style>
</head>
<body>
  <div class="icon"><img src="./ember-icon.png" alt="Ember" /></div>
  <h1>Ember</h1>
  <p class="subtitle">Every ember grows into fire</p>
  <p class="status" id="status">Starting up…</p>
  <div class="track"><div class="fill"></div></div>
  <script>
    window.setStatus = (msg) => { document.getElementById('status').textContent = msg }
  </script>
</body>
</html>
